<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Dynamic OCR Fixture</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #071225; }
    .scene { position: absolute; inset: -20%; background: conic-gradient(from 20deg, #142c5c, #096b70, #431658, #142c5c); animation: spin 2.4s linear infinite; filter: saturate(1.3); }
    .scene::after { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 20% 30%, #ffffff22 0 2px, transparent 3px 62px); animation: drift 1.1s ease-in-out infinite alternate; }
    .panel { position: relative; width: 900px; padding: 64px 72px; background: #0b1026dd; border: 2px solid #dceaff; border-radius: 24px; box-shadow: 0 24px 80px #000a; }
    .dialogue { min-height: 170px; display: grid; align-content: center; gap: 12px; color: #fff; font-size: 50px; font-weight: 700; line-height: 1.25; text-shadow: 0 3px 4px #000; transform: translate(0, 0); }
    .dialogue.jitter { animation: jitter .14s steps(2) infinite; }
    .dialogue.hidden { opacity: 0; }
    .controls { position: relative; margin-top: 36px; display: flex; align-items: center; gap: 16px; color: #dbeafe; font-size: 16px; }
    button { padding: 10px 16px; border: 1px solid #8ab4ff; border-radius: 9px; background: #10295d; color: white; font: inherit; cursor: pointer; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @keyframes drift { to { transform: translate(52px, -40px) scale(1.14); } }
    @keyframes jitter { 0% { transform: translate(-1px, 1px); } 100% { transform: translate(1px, -1px); } }
  </style>
</head>
<body>
  <div class="scene"></div>
  <main class="panel">
    <div id="dialogue" class="dialogue" aria-live="polite">
      <div>内通者がいるかどうか</div>
      <div>問題なんじゃない・・・</div>
    </div>
    <div class="controls">
      <button id="reset" type="button">Reset sequence</button>
      <span id="status">Stable text</span>
    </div>
  </main>
  <script>
    const dialogue = document.querySelector('#dialogue');
    const status = document.querySelector('#status');
    const original = ['内通者がいるかどうか', '問題なんじゃない・・・'];
    const replacement = ['彼女は何も言わなかった', 'それでも夜は明けていく'];
    let timers = [];

    function setLines(lines) {
      dialogue.replaceChildren(...lines.map((line) => Object.assign(document.createElement('div'), { textContent: line })));
    }

    function reset() {
      timers.forEach(clearTimeout);
      timers = [];
      dialogue.className = 'dialogue';
      setLines(original);
      status.textContent = 'Stable text';
      timers.push(setTimeout(() => { dialogue.classList.add('jitter'); status.textContent = 'Text bounds jitter'; }, 3000));
      timers.push(setTimeout(() => { dialogue.classList.remove('jitter'); setLines(replacement); status.textContent = 'Replacement text'; }, 7000));
      timers.push(setTimeout(() => { dialogue.classList.add('hidden'); status.textContent = 'Transient empty OCR'; }, 10500));
      timers.push(setTimeout(() => { dialogue.classList.remove('hidden'); status.textContent = 'Replacement restored'; }, 10850));
    }

    document.querySelector('#reset').addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
